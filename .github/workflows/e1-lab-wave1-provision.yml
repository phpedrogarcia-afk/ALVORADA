name: E1 lab wave1 provision probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: audit, dry-run, or apply'
        required: true
        default: 'audit'
        type: choice
        options:
          - audit
          - dry-run
          - apply
  push:
    branches:
      - fio/autonomy-g1
    paths:
      - '.github/workflows/e1-lab-wave1-provision.yml'

permissions:
  contents: read

concurrency:
  group: e1-lab-wave1-provision-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wave1-provision-probe:
    name: Wave 1 provisioning pre-flight and probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ALVORADA_REPOSITORY_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
      ALVORADA_WORKFLOW_PERMISSIONS: contents:read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Configure runner prerequisites
        shell: bash
        run: |
          set +e
          # 1. Ephemeral KVM permissions
          if test -e /dev/kvm; then
            sudo setfacl -m "u:${USER}:rw" /dev/kvm || true
          fi
          # 2. Ephemeral libpulse0 runtime dependency (proven in AUTO-MISSION-001/002)
          if ! ldconfig -p 2>/dev/null | grep -q 'libpulse\.so\.0' && [ ! -f /usr/lib/x86_64-linux-gnu/libpulse.so.0 ]; then
            sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libpulse0 || true
          fi

      - name: Execute Wave 1 provisioning probe
        working-directory: experiments/reliability-harness
        shell: bash
        run: |
          set +e
          mode="${{ github.event.inputs.mode || 'audit' }}"
          ./scripts/provision-wave1.sh --mode "$mode" 2>&1 | tee e1-lab-wave1-provision.log
          status=${PIPESTATUS[0]}
          printf 'wave1_exit_code=%s\n' "$status" | tee -a e1-lab-wave1-provision.log
          exit "$status"

      - name: Preserve Wave 1 provisioning log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e1-lab-wave1-provision-${{ github.sha }}-${{ github.run_id }}
          path: experiments/reliability-harness/e1-lab-wave1-provision.log
          if-no-files-found: warn
          retention-days: 1
