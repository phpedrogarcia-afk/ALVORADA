name: E1 lab GPU capability evidence (Recovery)

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: 'Expected commit SHA on fio/g1-autonomy-recovery'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e1-lab-gpu-evidence-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gpu-evidence-probe:
    name: Ephemeral GPU capability probe (Recovery)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALVORADA_REPOSITORY_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
      ALVORADA_WORKFLOW_PERMISSIONS: contents:read
    steps:
      - name: Guard branch ref
        shell: bash
        run: |
          if [ "${{ github.ref }}" != "refs/heads/fio/g1-autonomy-recovery" ]; then
            echo "ERROR: Invalid ref '${{ github.ref }}', expected 'refs/heads/fio/g1-autonomy-recovery'" >&2
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out commit matches HEAD and expected SHA
        shell: bash
        run: |
          expected="${{ inputs.expected_head_sha }}"
          if [ -z "$expected" ]; then
            echo "ERROR: inputs.expected_head_sha is required but was empty" >&2
            exit 1
          fi
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$expected" ]; then
            echo "ERROR: Checked-out commit ($checked_out) does not match expected_head_sha ($expected)" >&2
            exit 1
          fi
          if [ "$checked_out" != "${{ github.sha }}" ]; then
            echo "ERROR: Checked-out commit ($checked_out) does not match github.sha (${{ github.sha }})" >&2
            exit 1
          fi
          echo "HEAD_VERIFIED=$checked_out"

      - name: Causal runtime dependency verification (libpulse)
        shell: bash
        run: |
          python3 -c '
          import ctypes.util, os, sys, subprocess

          def has_libpulse():
              return bool(ctypes.util.find_library("pulse") or any(
                  os.path.exists(p) for p in [
                      "/usr/lib/x86_64-linux-gnu/libpulse.so.0",
                      "/usr/lib64/libpulse.so.0",
                      "/usr/lib/libpulse.so.0",
                      "/lib/x86_64-linux-gnu/libpulse.so.0",
                  ]
              ))

          present_before = has_libpulse()
          ans_before = "YES" if present_before else "NO"
          print(f"LIBPULSE_PRESENT_BEFORE={ans_before}")

          if not present_before:
              print("LIBPULSE_MUTATION=REQUIRED")
              cmd_update = ["sudo", "DEBIAN_FRONTEND=noninteractive", "apt-get", "update"]
              rc1 = subprocess.run(cmd_update).returncode
              if rc1 != 0:
                  print("ERROR: apt-get update failed", file=sys.stderr)
                  sys.exit(rc1)
              cmd_install = ["sudo", "DEBIAN_FRONTEND=noninteractive", "apt-get", "install", "-y", "--no-install-recommends", "libpulse0"]
              rc2 = subprocess.run(cmd_install).returncode
              print(f"LIBPULSE_MUTATION_EXIT_CODE={rc2}")
              if rc2 != 0:
                  print("ERROR: apt-get install libpulse0 failed", file=sys.stderr)
                  sys.exit(rc2)
              present_after = has_libpulse()
              ans_after = "YES" if present_after else "NO"
              print(f"LIBPULSE_PRESENT_AFTER={ans_after}")
              if not present_after:
                  print("ERROR: libpulse.so.0 still absent after mutation", file=sys.stderr)
                  sys.exit(1)
          else:
              print("LIBPULSE_MUTATION=NONE")
              print("LIBPULSE_MUTATION_EXIT_CODE=0")
              print("LIBPULSE_PRESENT_AFTER=YES")
          '

      - name: Pre-execution automated test suite
        shell: bash
        run: |
          python3 -m unittest discover -s experiments/reliability-harness/scripts -p "test_*.py"

      - name: Execute ephemeral GPU capability probe
        shell: bash
        run: |
          obs_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p experiments/reliability-harness/artifacts
          python3 experiments/reliability-harness/scripts/gpu_evidence_runner.py \
            --output-dir experiments/reliability-harness/artifacts \
            --repo-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --observed-at "$obs_time" \
            --candidate-revision "37.1.11"

      - name: Verify artifact checksums
        shell: bash
        run: |
          cd experiments/reliability-harness/artifacts
          sha256sum -c checksums.sha256

      - name: Enforce raw data policy (no raw output in artifacts)
        shell: bash
        run: |
          for forbidden in raw_gpu_output.txt raw_help.txt raw_sdk_catalog.txt raw_catalog.txt; do
            if [ -f "experiments/reliability-harness/artifacts/$forbidden" ]; then
              echo "ERROR: Forbidden raw file $forbidden detected in artifacts directory!" >&2
              exit 1
            fi
          done
          echo "RAW_DATA_POLICY=PASS"

      - name: Upload GPU capability evidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpu-evidence-${{ github.sha }}-${{ github.run_id }}
          path: experiments/reliability-harness/artifacts/
          if-no-files-found: error
          retention-days: 1
